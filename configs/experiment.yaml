random_seed: 42

mongodb:
  uri: mongodb://127.0.0.1:27017
  database: AUTO

schema:
  project: fields.project.key
  created: fields.created
  updated: fields.updated
  resolution: fields.resolutiondate
  issue_type: fields.issuetype.name
  priority: fields.priority.name
  status: fields.status.name
  summary: fields.summary
  description: fields.description
  labels: fields.labels
  components: fields.components
  assignee: fields.assignee
  changelog_histories: changelog.histories
  comments: fields.comment.comments

selection:
  min_issues: 1000
  min_resolved: 500
  min_unresolved: 50
  min_censoring_rate: 0.01
  max_censoring_rate: 0.80
  max_projects: 12
  max_projects_per_repository: 3

features:
  strict_no_leakage: true
  landmark_days: 7
  normalize_priority_labels: true

models:
  cox:
    alpha: 0.10

  rsf:
    n_estimators: 150
    max_depth: 8
    min_samples_split: 100
    min_samples_leaf: 50
    max_features: sqrt
    n_jobs: -1

  max_train_rows: 50000

evaluation:
  modes:
    - day0
    - day7

  horizons_days:
    - 30
    - 60
    - 90

  max_ibs_rows: 2000
  survival_batch_size: 16

cross_project:
  fast_mode: false
  smoke_folds: 3
  resume: true
  force_rerun: false

xai:
  permutation_rows: 2000
  permutation_repeats: 5
  survshap_background_rows: 25
  candidate_rows: 200
